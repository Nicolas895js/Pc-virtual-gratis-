lscr.io/linuxserver/webtop:ubuntu-xfce
FROM lscr.io/linuxserver/webtop:ubuntu-xfce

ENV TITLE="PC Virtual Cloud"
ENV TZ=America/Sao_Paulo

USER root

RUN apt-get update && \
    apt-get install -y --no-install-recommends \
      curl wget git unzip \
      python3 python3-pip \
      nano htop mesa-utils \
      ca-certificates && \
    apt-get clean && \
    rm -rf /var/lib/apt/lists/*

RUN mkdir -p /games /config/Arquivos /config/Downloads

WORKDIR /config

EXPOSE 3000 3001

CMD ["/init"]

services:
  pc-virtual:
    build: .
    image: pc-virtual-cloud:latest
    container_name: pc-virtual-cloud
    restart: unless-stopped

    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Sao_Paulo
      TITLE: "PC Virtual Cloud"
      CUSTOM_USER: "${PC_USER:?Configure PC_USER}"
      PASSWORD: "${PC_PASSWORD:?Configure PC_PASSWORD}"

    ports:
      - "3001:3001"

    shm_size: "2gb"

    volumes:
      - pc_config:/config
      - pc_games:/games

volumes:
  pc_config:
  pc_games:
  docker compose build
docker compose up -d
docker compose ps
