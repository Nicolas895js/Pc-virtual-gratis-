
name: Build PC Virtual

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker
        run: |
          docker build -t pc-virtual .

      - name: Salvar imagem
        run: |
          docker save pc-virtual -o pc-virtual.tar

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pc-virtual-build
          path: pc-virtual.tar
          
