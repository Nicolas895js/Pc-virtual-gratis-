
# PC Gamer Virtual - preparação básica
# Executar no Windows da máquina virtual.

$ErrorActionPreference = "Stop"

Write-Host "Preparando o Windows para jogos..." -ForegroundColor Cyan

# Verificar privilégios de administrador
$principal = New-Object Security.Principal.WindowsPrincipal(
    [Security.Principal.WindowsIdentity]::GetCurrent()
)

if (-not $principal.IsInRole(
    [Security.Principal.WindowsBuiltInRole]::Administrator
)) {
    throw "Execute o PowerShell como administrador."
}

# Mostrar os recursos disponíveis na máquina
Get-CimInstance Win32_ComputerSystem |
    Select-Object Name, TotalPhysicalMemory,
        NumberOfLogicalProcessors

Get-CimInstance Win32_VideoController |
    Select-Object Name, AdapterRAM, DriverVersion

Get-Volume |
    Select-Object DriveLetter, FileSystemLabel,
        Size, SizeRemaining

# Instalar Steam pelo Windows Package Manager, se disponível
if (Get-Command winget -ErrorAction SilentlyContinue) {
    winget install --id Valve.Steam `
        --exact --accept-package-agreements `
        --accept-source-agreements
} else {
    Write-Host "Instale o Steam pelo site oficial:"
    Write-Host "https://store.steampowered.com/about/"
}

Write-Host "Verifique RAM, GPU e espaço em disco antes de instalar ARK."
