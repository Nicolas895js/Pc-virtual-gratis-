
name: PC Virtual Gamer - Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10000

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Docker
        uses: docker/setup-buildx-action@v3

      - name: Validar arquivos
        run: |
          set -eu
          test -f Dockerfile
          test -f docker-compose.yml
          test -f .env.example
          test -f README.md

      - name: Validar Docker Compose
        run: |
          set -eu
          cp .env.example .env
          docker compose config --quiet
          rm -f .env

      - name: Construir PC virtual
        run: |
          docker build --pull \
            -t cloud-gamer:${GITHUB_SHA::12} .

      - name: Exportar imagem Docker
        run: |
          mkdir -p dist
          docker save \
            cloud-gamer:${GITHUB_SHA::12} \
            -o dist/pc-virtual-gamer.tar

      - name: Criar checksum
        run: |
          cd dist
          sha256sum pc-virtual-gamer.tar \
            > pc-virtual-gamer.tar.sha256

      - name: Salvar artefato
        uses: actions/upload-artifact@v4
        with:
          name: pc-virtual-gamer
          path: dist/
          retention-days: 14

      - name: Resultado
        run: echo "Build concluida com sucesso!"
        
