
# PC Gamer Cloud

## Requisitos
- Servidor Linux com Docker e Docker Compose
- Armazenamento persistente
- Internet estável
- GPU compatível para jogos que exigem aceleração gráfica

## Construir
docker compose build

## Iniciar
docker compose up -d

## Verificar
docker compose ps

## Ver logs
docker compose logs -f pc-gamer

## Parar
docker compose down

## Pastas
/config  - configurações e arquivos pessoais
/games   - diretório destinado aos jogos

services:
  pc-gamer:
    build: .
    container_name: pc-gamer-cloud
    restart: unless-stopped

    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Sao_Paulo
      TITLE: "Meu PC Gamer na Nuvem"

    ports:
      - "3000:3000"
      - "3001:3001"

    shm_size: "2gb"

    volumes:
      - pc_config:/config
      - pc_games:/games

volumes:
  pc_config:
  pc_games:
  
